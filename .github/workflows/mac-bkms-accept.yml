# 临时验收：签名 mac 包上核对 @bkms/bundle@0.1.3 / skill-creator。
# 仅存在于 cursor/mac-signed-accept-e386；勿合入 PR #1；验完删分支。
name: mac-bkms-accept
on:
  workflow_dispatch:
  push:
    branches: [cursor/mac-signed-accept-e386]
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-bkms-accept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  accept:
    name: macos-signed-accept
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # 签名验收 run（build-desktop sign 路径产物）
      SIGNED_RUN_ID: '39390545798'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: 检出临时验收分支
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 下载签名 mac 产物
        uses: actions/download-artifact@v8.0.1
        with:
          run-id: ${{ env.SIGNED_RUN_ID }}
          name: macos-arm64-signed-${{ env.SIGNED_RUN_ID }}
          path: artifacts
          github-token: ${{ github.token }}
      - name: 解包并验收
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts
          DMG=$(echo artifacts/*.dmg)
          ZIP=$(echo artifacts/*.zip)
          echo "DMG=$DMG"
          echo "ZIP=$ZIP"
          mkdir -p app
          unzip -q -o "$ZIP" -d app
          APP="$(find app -name 'DeepSeek Harness.app' -type d | head -1)"
          test -n "$APP"
          echo "APP=$APP"

          echo '--- codesign --verify --deep --strict ---'
          codesign --verify --deep --strict -vv "$APP" 2>&1 | tee codesign-verify.txt

          echo '--- spctl -a -vv ---'
          spctl -a -vv --type exec "$APP" 2>&1 | tee spctl.txt

          echo '--- xcrun stapler validate DMG ---'
          xcrun stapler validate "$DMG" 2>&1 | tee stapler.txt

          echo '--- extract app.asar ---'
          # npm pack 不含依赖；装进临时目录再抽 asar（解包工具本身可用 runner npm，脚本验收仍用包内 Node）。
          mkdir -p /tmp/asar-install
          npm install --prefix /tmp/asar-install --no-save --no-fund --no-audit @electron/asar@3.4.1
          ASAR_JS=/tmp/asar-install/node_modules/@electron/asar/bin/asar.js
          test -f "$ASAR_JS"
          # 包内 primary-runtime Node（与 Desktop 自带 runtime 一致）；禁止用 runner 系统 node 跑脚本验收。
          NODE_BIN="$APP/Contents/Resources/runtime/primary-runtime/dependencies/node/bin/node"
          test -x "$NODE_BIN"
          echo "PACKAGED_NODE=$NODE_BIN"
          "$NODE_BIN" --version
          "$NODE_BIN" "$ASAR_JS" extract "$APP/Contents/Resources/app.asar" asar-root
          python3 - <<'PY'
          import json
          p='asar-root/dsh/node_modules/@bkms/bundle/package.json'
          m=json.load(open(p))
          print(m['name'], m['version'])
          assert m['name']=='@bkms/bundle' and m['version']=='0.1.3'
          PY
          test -f asar-root/dsh/node_modules/@bkms/bundle/assets/skills/skill-creator/SKILL.md
          test -f asar-root/dsh/node_modules/@bkms/bundle/assets/skills/skill-creator/scripts/validate_skill.mjs
          echo 'asar @bkms/bundle@0.1.3 + skill-creator assets OK'

          export DSH_ACCEPT_APP_ROOT="$PWD/$APP"
          export DSH_ACCEPT_ASAR_ROOT="$PWD/asar-root"
          export DSH_ACCEPT_DMG="$PWD/$DMG"
          export DSH_ACCEPT_NODE="$NODE_BIN"
          export DSH_HOME="$HOME/.dsh"
          export DSH_ACCEPT_WORK="$RUNNER_TEMP/bkms-accept-project"
          mkdir -p "$DSH_HOME" "$DSH_ACCEPT_WORK"
          # 整段验收脚本也用包内 Node 执行（含 validate_skill / 示例 .mjs）。
          "$NODE_BIN" scripts/ci/mac-bkms-accept.mjs
      - name: 上传验收日志
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mac-bkms-accept-logs-${{ github.run_id }}
          path: |
            codesign-verify.txt
            spctl.txt
            stapler.txt
          if-no-files-found: ignore
          retention-days: 7
